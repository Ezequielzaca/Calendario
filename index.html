<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión — Bienes de Uso · TelCo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00B0EA;
  --lima:#CCD400;
  --verde:#009238;
  --gris-osc:#2F2F2F;
  --gris-claro:#F5F7F9;
  --font-telco:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-telco);
  color:var(--gris-osc);
  background:#fff;
  min-height:100vh;
  overflow-x:hidden;
}
.blob{position:fixed;z-index:-1;pointer-events:none}
.blob-tr{top:-220px;right:-200px;width:640px;height:640px}
.blob-bl{bottom:-260px;left:-240px;width:560px;height:560px;opacity:.7}

/* ===== Layout con sidebar ===== */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;
  background:rgba(245,247,249,.7);backdrop-filter:blur(18px);
  border-right:1px solid rgba(0,176,234,.15);
  padding:26px 16px;display:flex;flex-direction:column;gap:6px;
  transition:margin-left .25s;z-index:40;
}
.sidebar .logo{display:block;margin:0 auto 8px;height:46px}
.sidebar .side-title{font-size:.68rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;text-align:center;margin-bottom:18px}
.side-item{
  display:flex;align-items:center;gap:12px;width:100%;
  font:600 .92rem var(--font-telco);color:var(--gris-osc);
  background:transparent;border:none;border-radius:16px;
  padding:14px 16px;cursor:pointer;text-align:left;transition:.2s;
}
.side-item small{display:block;font-weight:400;font-size:.68rem;color:#6b7280}
.side-item:hover{background:rgba(0,176,234,.08)}
.side-item.active{
  background:linear-gradient(135deg,var(--cyan),var(--verde));color:#fff;
  box-shadow:0 8px 26px rgba(0,176,234,.3);
}
.side-item.active small{color:rgba(255,255,255,.85)}
.side-item .ico{font-size:1.2rem}
.side-item .badge{margin-left:auto;background:rgba(204,212,0,.85);color:#3a3d00;font-size:.68rem;font-weight:700;border-radius:999px;padding:3px 9px}
.side-foot{margin-top:auto;font-size:.66rem;color:var(--verde);text-align:center;line-height:1.5}

#menuBtn{display:none;position:fixed;top:14px;left:14px;z-index:60;font-size:1.1rem;background:#fff;border:1px solid rgba(0,176,234,.35);border-radius:12px;padding:9px 13px;cursor:pointer;box-shadow:0 6px 24px rgba(0,176,234,.2)}
.scrim{display:none;position:fixed;inset:0;background:rgba(47,47,47,.3);z-index:35}

.content{flex:1;min-width:0;padding:28px 32px 60px;max-width:1280px}

/* ===== Header ===== */
header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.brand h1{font-weight:800;font-size:1.8rem;line-height:1.05}
.brand h1 span{background:linear-gradient(135deg,var(--cyan),var(--verde));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:.85rem;color:#6b7280;margin-top:4px}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ===== Botones ===== */
.btn{font:600 .85rem/1 var(--font-telco);border:none;cursor:pointer;border-radius:999px;padding:12px 20px;transition:.2s;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn-grad{color:#fff;background:linear-gradient(135deg,var(--cyan) 0%,var(--lima) 100%);box-shadow:0 8px 30px rgba(0,176,234,.35)}
.btn-grad:hover{transform:translateY(-1px);box-shadow:0 10px 34px rgba(0,176,234,.45)}
.btn-ghost{background:rgba(255,255,255,.6);backdrop-filter:blur(10px);border:1px solid rgba(0,176,234,.35);color:var(--cyan)}
.btn-ghost:hover{background:rgba(0,176,234,.08)}
.btn-danger{background:none;border:none;color:#d64545;cursor:pointer;font-size:.9rem;padding:4px}
.btn-edit{background:none;border:none;color:var(--cyan);cursor:pointer;font-size:.9rem;padding:4px}

/* ===== Tabs de vehículos ===== */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.tab{font:600 .82rem/1 var(--font-telco);padding:11px 18px;border-radius:999px;cursor:pointer;border:1px solid rgba(0,146,56,.25);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);color:var(--gris-osc);transition:.2s}
.tab small{display:block;font-weight:400;font-size:.68rem;color:#6b7280;margin-top:3px}
.tab:hover{border-color:var(--cyan)}
.tab.active{background:linear-gradient(135deg,var(--cyan),var(--verde));color:#fff;border-color:transparent;box-shadow:0 8px 26px rgba(0,176,234,.3)}
.tab.active small{color:rgba(255,255,255,.85)}

/* ===== Cards ===== */
.glass{background:rgba(245,247,249,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:26px}
.kpi{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:22px 26px;box-shadow:0 8px 40px rgba(0,176,234,.14)}
.kpi .num{font-weight:700;font-size:1.8rem;color:var(--verde);display:block}
.kpi .lbl{font-size:.85rem;color:var(--gris-osc);margin-top:4px;display:block}

/* ===== Tablas ===== */
.tbl-card{padding:6px 0 0;overflow:hidden;margin-bottom:26px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-weight:600;text-align:left;padding:14px 16px;color:var(--verde);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid rgba(0,176,234,.25);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid rgba(47,47,47,.06);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{transition:.15s}
tbody tr:hover{background:rgba(0,176,234,.05)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.money{font-weight:600;color:var(--verde);white-space:nowrap}
.muted{color:#9ca3af}
.chip{display:inline-block;font-size:.7rem;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap}
.chip-service{background:rgba(0,176,234,.12);color:#0077a3}
.chip-reparacion{background:rgba(204,212,0,.2);color:#7a7f00}
.chip-repuesto{background:rgba(0,146,56,.12);color:var(--verde)}
.chip-otro{background:rgba(47,47,47,.08);color:var(--gris-osc)}
.chip-alerta{background:rgba(214,69,69,.12);color:#d64545}
.chip-ok{background:rgba(0,146,56,.12);color:var(--verde)}
.chip-warn{background:rgba(204,212,0,.2);color:#7a7f00}

/* ===== Sección vehículo ===== */
.veh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 30px;margin-bottom:22px}
.veh-head h2{font-weight:700;font-size:1.5rem}
.veh-head .patente{display:inline-block;font-weight:800;font-size:.95rem;letter-spacing:.12em;background:#fff;border:2px solid var(--gris-osc);border-radius:8px;padding:5px 14px;margin-bottom:8px}
.veh-meta{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.veh-meta label{font-size:.72rem;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.veh-meta input{font:500 1rem var(--font-telco);border:1px solid rgba(0,176,234,.3);border-radius:12px;padding:9px 13px;width:130px;background:rgba(255,255,255,.7);color:var(--gris-osc)}
.veh-meta input:focus{outline:2px solid var(--cyan);border-color:transparent}

.section-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtro{font:600 .75rem/1 var(--font-telco);padding:8px 15px;border-radius:999px;border:1px solid rgba(0,176,234,.3);background:transparent;color:#6b7280;cursor:pointer;transition:.15s}
.filtro.active{background:var(--cyan);color:#fff;border-color:var(--cyan)}

.empty{padding:44px;text-align:center;color:#9ca3af;font-size:.9rem}

/* select de estado de tarea */
.estado-sel{font:600 .78rem var(--font-telco);border:1px solid rgba(0,176,234,.3);border-radius:999px;padding:6px 10px;background:#fff;color:var(--gris-osc);cursor:pointer}
.tarea-vencida{color:#d64545;font-weight:700}
.tarea-done td{opacity:.5}
.tarea-done .t-titulo{text-decoration:line-through}
.prio-titulo{font-weight:700;font-size:1rem;margin:2px 6px 10px;display:flex;align-items:center;gap:8px}
.prio-titulo .cnt{font-weight:600;font-size:.75rem;color:#6b7280}
.ubi-inline{font:500 .82rem var(--font-telco);border:1px solid rgba(0,176,234,.25);border-radius:10px;padding:6px 10px;width:150px;background:rgba(255,255,255,.7);color:var(--gris-osc)}
.ubi-inline:focus{outline:2px solid var(--cyan);border-color:transparent}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(47,47,47,.35);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:0 20px 80px rgba(0,176,234,.25);width:100%;max-width:640px;padding:32px 34px}
.modal h3{font-weight:700;font-size:1.25rem;margin-bottom:22px}
.modal h3 span{color:var(--cyan)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.fld label{font-size:.74rem;font-weight:600;color:#4b5563;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{width:100%;font:400 .92rem var(--font-telco);border:1px solid rgba(0,176,234,.3);border-radius:12px;padding:11px 13px;background:#fff;color:var(--gris-osc)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--cyan);border-color:transparent}
.fld textarea{resize:vertical;min-height:64px}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}
.hint{font-size:.72rem;color:#9ca3af;margin-top:5px}

/* ===== Toast ===== */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gris-osc);color:#fff;font-size:.85rem;font-weight:500;padding:13px 24px;border-radius:999px;opacity:0;transition:.3s;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:920px){
  #menuBtn{display:block}
  .sidebar{position:fixed;left:0;top:0;margin-left:-270px;box-shadow:0 0 60px rgba(0,0,0,.15)}
  .sidebar.open{margin-left:0}
  .scrim.on{display:block}
  .content{padding:64px 14px 40px}
  .form-grid{grid-template-columns:1fr}
  .veh-head{padding:20px}
}
@media print{
  .sidebar,#menuBtn,.header-actions,.tabs,.filtros,.btn,.btn-edit,.btn-danger,.blob{display:none!important}
  .glass,.kpi{border:1px solid #ddd;box-shadow:none}
  .content{padding:0}
}
</style>
</head>

<svg class="blob blob-bl" viewBox="0 0 600 600" aria-hidden="true">

  <path fill="url(#g2)" opacity=".13" d="M420,90Q520,160,500,300T360,500Q220,560,140,460T80,250Q120,120,250,80T420,90Z"/>

<button id="menuBtn" onclick="toggleMenu()">☰</button>
<div class="scrim" id="scrim" onclick="toggleMenu(false)"></div>

<div class="layout">

  <aside class="sidebar" id="sidebar">

    </button>
    <button class="side-item" data-mod="refrigerios" onclick="irModulo('refrigerios')">
      <span class="ico">🍎</span><span>Refrigerios<small>Frutas y yogures</small></span>
    </button>
    <button class="side-item" data-mod="alojamiento" onclick="irModulo('alojamiento')">
      <span class="ico">🏨</span><span>Alojamiento<small>Viajes y estadías</small></span>

    <button class="side-item" data-mod="solicitudes" onclick="irModulo('solicitudes')">
      <span class="ico">📋</span><span>Solicitudes<small>Compras · sheet en vivo</small></span>
    </button>
    <button class="side-item" data-mod="seguimientos" onclick="irModulo('seguimientos')">
      <span class="ico">📦</span><span>Seguimientos<small>Inventario y ubicaciones</small></span>
    </button>
    <button class="side-item" data-mod="tareas" onclick="irModulo('tareas')">
      <span class="ico">✅</span><span>Tareas<small>Agenda y seguimiento</small></span>
      <span class="badge" id="badgeTareas" style="display:none"></span>
    </button>
    <div class="side-foot"><div id="syncEstado" style="margin-bottom:6px;font-weight:700">☁ Conectando…</div>Dr. R. Carrillo 444 - IOSCor - 5° Piso<br>0810-555-8352 · info@telco.com.ar</div>
  </aside>

  <div class="content">
    <header>
      <div class="brand">
        <h1 id="tituloModulo">Planilla de <span>Rodados</span></h1>
        <p>Administración y Finanzas · Compras y Contrataciones · Bienes de Uso</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="exportarCSV()">⬇ Exportar CSV</button>
        <button class="btn btn-ghost" onclick="exportarJSON()">💾 Respaldo</button>
        <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">📂 Restaurar</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importarJSON(event)">
        <button class="btn btn-grad" id="btnNuevo" onclick="nuevoActual()">+ Nuevo registro</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" style="display:none"></nav>

    <main id="main"></main>
  </div>
</div>

<!-- Modal genérico -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Nuevo <span>registro</span></h3>
    <div class="form-grid" id="formGrid"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-grad" onclick="guardarModal()">Guardar</button>
    </div>
  </div>
</div>

function cargar(){
  let d = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) d = JSON.parse(raw);
  }catch(e){ console.warn("No se pudo leer el almacenamiento local:", e); }
  if(!d || !Array.isArray(d.vehiculos)) d = {vehiculos: VEHICULOS_BASE.map(v => ({...v, kmActual:"", proxServiceKm:""}))};
  if(!Array.isArray(d.registros))   d.registros = [];
  if(!Array.isArray(d.remises))     d.remises = [];
  if(!Array.isArray(d.refrigerios)) d.refrigerios = [];
  if(!Array.isArray(d.alojamientos)) d.alojamientos = [];
  if(!Array.isArray(d.tareas))      d.tareas = [];
  if(!Array.isArray(d.seguimientos)) d.seguimientos = [];
  return d;
}

/* ============ Sincronización en la nube (Firebase RTDB) ============ */
const FB_URL = "https://calendariotelk-default-rtdb.firebaseio.com/gestionBienes.json";
let nubeTimer = null;
let nubeLista = false;   // recién después de la carga inicial se permite subir

function setNube(estado, detalle){
  const el = document.getElementById("syncEstado");
  if(!el) return;
  const m = {ok:"☁ Sincronizado", guardando:"☁ Guardando…", error:"⚠ Sin conexión (datos locales)", off:"☁ Conectando…"};
  el.textContent = m[estado] || "";
  el.title = detalle || "";
  el.style.color = estado==="error" ? "#d64545" : "";
}
function normalizarDb(d){
  if(!d || typeof d !== "object") return null;
  if(!Array.isArray(d.vehiculos)) return null;
  for(const k of ["registros","remises","refrigerios","alojamientos","tareas","seguimientos"]) if(!Array.isArray(d[k])) d[k] = [];
  return d;
}
function combinarDb(base, extra){
  for(const v of (extra.vehiculos||[])){
    const cur = base.vehiculos.find(x=>x.id===v.id);
    if(!cur) base.vehiculos.push(v);
    else{
      if(!cur.kmActual && v.kmActual) cur.kmActual = v.kmActual;
      if(!cur.proxServiceKm && v.proxServiceKm) cur.proxServiceKm = v.proxServiceKm;
    }
  }
  for(const k of ["registros","remises","refrigerios","alojamientos","tareas","seguimientos"]){
    for(const r of (extra[k]||[])){
      if(r && r.id && !base[k].find(x=>x.id===r.id)) base[k].push(r);
    }
  }
  return base;
}
function nubeGuardar(){
  if(!nubeLista) return;
  clearTimeout(nubeTimer);
  setNube("guardando");
  nubeTimer = setTimeout(async () => {
    try{
      const res = await fetch(FB_URL, {method:"PUT", body: JSON.stringify(db)});
      if(!res.ok) throw new Error("HTTP "+res.status);
      setNube("ok");
    }catch(e){ setNube("error", String(e)); }
  }, 700);
}
async function nubeCargar(){
  setNube("off");
  try{
    const res = await fetch(FB_URL);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const remoto = normalizarDb(await res.json());
    if(remoto){
      db = combinarDb(remoto, db);   // manda la nube; lo local que falte se suma, nada se borra
      try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(e){}
    }
    nubeLista = true;
    const res2 = await fetch(FB_URL, {method:"PUT", body: JSON.stringify(db)});
    if(!res2.ok) throw new Error("HTTP "+res2.status);
    setNube("ok");
    render();
  }catch(e){
    nubeLista = true;   // permite reintentar en el próximo guardado
    setNube("error", String(e));
  }
}

const fmtMoney = n => (n===""||n==null||isNaN(n)) ? "—" :
  new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);

function fmtFecha(iso){
  if(!iso) return "—";
  const p = iso.split("-");
  return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso;
}

/* ============ Modal genérico ============ */
function nuevoActual(){ if(modulo==="solicitudes"){ toast("Las solicitudes se cargan en el Google Sheet"); return; } abrirModal(modulo, null); }
function abrirModal(mod, reg, extra){
  editandoCol = mod;
  editandoId = reg ? reg.id : null;
  document.getElementById("modalTitle").innerHTML = (reg ? "Editar" : "Nuevo") + " <span>" +
    ({rodados:"registro", remises:"traslado", refrigerios:"compra", alojamiento:"alojamiento", seguimientos:"producto", tareas:"tarea"}[mod]) + "</span>";
  let h = "";
  for(const f of FORM_DEFS[mod]){
    h += '<div class="fld'+(f.full?" full":"")+'"><label>'+f.label+'</label>';
    if(f.type==="select"){
      h += '<select id="fm_'+f.id+'">' + f.opts().map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join("") + '</select>';
    }else if(f.type==="textarea"){
      h += '<textarea id="fm_'+f.id+'" placeholder="'+esc(f.ph||"")+'"></textarea>';
    }else{
      h += '<input type="'+f.type+'" id="fm_'+f.id+'"'+(f.list?' list="dl_'+f.id+'" autocomplete="off"':'')+' placeholder="'+esc(f.ph||"")+'">';
      if(f.list) h += '<datalist id="dl_'+f.id+'">'+f.list().map(o=>'<option value="'+esc(o)+'"></option>').join("")+'</datalist>';
    }
    if(f.hint) h += '<div class="hint">'+esc(f.hint)+'</div>';
    h += '</div>';
  }
  document.getElementById("formGrid").innerHTML = h;
  // valores iniciales
  for(const f of FORM_DEFS[mod]){
    const el = document.getElementById("fm_"+f.id);
    if(reg){ el.value = reg[f.id] ?? ""; }
    else if(f.id==="fecha"){ el.value = hoyISO(); }
    else if(f.type==="select"){ el.selectedIndex = 0; }
  }
  if(mod==="rodados" && !reg){
    const sel = document.getElementById("fm_vehiculoId");
    if(extra && vehiculo(extra)) sel.value = extra;
    else if(vistaActual!=="resumen" && vehiculo(vistaActual)) sel.value = vistaActual;
  }
  document.getElementById("overlay").classList.add("open");
}
function cerrarModal(){ document.getElementById("overlay").classList.remove("open"); editandoId = null; editandoCol = null; }
document.getElementById("overlay").addEventListener("click", e => { if(e.target.id==="overlay") cerrarModal(); });
document.addEventListener("keydown", e => { if(e.key==="Escape") cerrarModal(); });

function guardarModal(){
  const mod = editandoCol;
  const datos = {};
  for(const f of FORM_DEFS[mod]){
    const el = document.getElementById("fm_"+f.id);
    datos[f.id] = (el.value||"").trim ? String(el.value).trim() : el.value;
  }
  if(mod==="tareas"){
    if(!datos.titulo){ toast("⚠ Ingresá el nombre de la tarea"); return; }
  }else if(mod==="seguimientos"){
    if(!datos.producto){ toast("⚠ Ingresá el nombre del producto"); return; }
  }else if(!datos.fecha){ toast("⚠ Ingresá la fecha"); return; }

  const col = db[MODULOS[mod].coleccion];
  if(editandoId){
    const i = col.findIndex(r=>r.id===editandoId);
    if(i>=0) col[i] = {...col[i], ...datos};
    toast("✓ Actualizado");
  }else{
    datos.id = nuevoId();
    if(mod==="tareas") datos.creada = hoyISO();
    col.push(datos);
    toast("✓ Guardado");
  }
  if(mod==="rodados"){
    const v = vehiculo(datos.vehiculoId);
    const kmReg = parseFloat(datos.km), kmAct = parseFloat(v && v.kmActual);
    if(v && !isNaN(kmReg) && (isNaN(kmAct) || kmReg > kmAct)) v.kmActual = datos.km;
    vistaActual = datos.vehiculoId;
  }
  persistir();
  cerrarModal();
  render();
}
function editarReg(mod, id){
  const r = db[MODULOS[mod].coleccion].find(x=>x.id===id);
  if(r) abrirModal(mod, r);
}
function eliminarReg(mod, id){
  const col = db[MODULOS[mod].coleccion];
  const r = col.find(x=>x.id===id);
  if(!r) return;
  const desc = mod==="tareas" ? ('la tarea "'+ (r.titulo||"") +'"')
             : mod==="seguimientos" ? ('"'+ (r.producto||"") +'" en '+ (r.ubicacion||"s/ubicación"))
             : ("el registro del " + fmtFecha(r.fecha));
  if(confirm("¿Eliminar "+desc+"?")){
    db[MODULOS[mod].coleccion] = col.filter(x=>x.id!==id);
    persistir(); render();
    toast("Eliminado");
  }
}
function accionesFila(mod, id){
  return '<td class="nowrap"><button class="btn-edit" title="Editar" onclick="editarReg(\''+mod+'\',\''+id+'\')">✎</button>'
       + '<button class="btn-danger" title="Eliminar" onclick="eliminarReg(\''+mod+'\',\''+id+'\')">🗑</button></td>';
}

function renderResumen(){
  const totalFlota = db.vehiculos.reduce((a,v)=> a+totalDe(v.id), 0);
  const anio = new Date().getFullYear();
  const regsAnio = delAnio(db.registros);
  const servicesAnio = regsAnio.filter(r=>r.tipo==="Service").length;

  let h = '<div class="kpis">'
    + '<div class="kpi"><span class="num">'+db.vehiculos.length+'</span><span class="lbl">Vehículos en la flota</span></div>'
    + '<div class="kpi"><span class="num">'+db.registros.length+'</span><span class="lbl">Registros cargados</span></div>'
    + '<div class="kpi"><span class="num">'+servicesAnio+'</span><span class="lbl">Services en '+anio+'</span></div>'
    + '<div class="kpi"><span class="num">'+fmtMoney(sumCosto(regsAnio))+'</span><span class="lbl">Gastado en '+anio+'</span></div>'
    + '<div class="kpi"><span class="num">'+fmtMoney(totalFlota)+'</span><span class="lbl">Gasto total histórico</span></div>'
    + '</div>';

  h += '<div class="glass tbl-card"><div class="tbl-scroll"><table><thead><tr>'
    + '<th>Vehículo</th><th>Último service</th><th>KM último service</th><th>KM actual</th><th>Próx. service</th><th>Estado</th><th class="right">Registros</th><th class="right">Total gastado</th>'
    + '</tr></thead><tbody>';

  for(const v of db.vehiculos){
    const us = ultimoService(v.id);
    const km = parseFloat(v.kmActual);
    const prox = parseFloat(v.proxServiceKm);
    let estado = '<span class="muted">—</span>';
    if(!isNaN(km) && !isNaN(prox)){
      estado = km >= prox
        ? '<span class="chip chip-alerta">Service vencido</span>'
        : '<span class="chip chip-ok">Faltan '+new Intl.NumberFormat("es-AR").format(prox-km)+' km</span>';
    }
    h += '<tr style="cursor:pointer" onclick="irA(\''+v.id+'\')">'
      + '<td class="nowrap"><b>'+esc(v.patente)+'</b><br><span class="muted">'+esc(v.modelo)+'</span></td>'
      + '<td class="nowrap">'+(us ? ('N° '+esc(us.nroService||"—")+' · '+fmtFecha(us.fecha)) : '<span class="muted">Sin services</span>')+'</td>'
      + '<td class="nowrap">'+(us ? fmtKm(parseFloat(us.km)) : "—")+'</td>'
      + '<td class="nowrap">'+fmtKm(km)+'</td>'
      + '<td class="nowrap">'+fmtKm(prox)+'</td>'
      + '<td>'+estado+'</td>'
      + '<td class="right">'+regsDe(v.id).length+'</td>'
      + '<td class="right money">'+fmtMoney(totalDe(v.id))+'</td>'
      + '</tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}

function renderVehiculo(id){

    + '<div><span class="patente">'+esc(v.patente)+'</span><h2>'+esc(v.modelo)+'</h2>'
    + '<p class="muted" style="margin-top:6px;font-size:.85rem">'
    + (us ? 'Último service: N° '+esc(us.nroService||"—")+' · '+fmtFecha(us.fecha)+' · '+fmtKm(parseFloat(us.km)) : 'Sin services registrados')
    + '</p></div>'
    + '<div class="veh-meta">'
    + '<div><label>KM actual</label><input type="number" min="0" value="'+esc(v.kmActual)+'" onchange="setVehCampo(\''+id+'\',\'kmActual\',this.value)" placeholder="Ej: 52000"></div>'
    + '<div><label>Próx. service (km)</label><input type="number" min="0" value="'+esc(v.proxServiceKm)+'" onchange="setVehCampo(\''+id+'\',\'proxServiceKm\',this.value)" placeholder="Ej: 60000"></div>'

    + '</div></div>';

  h += '<div class="section-bar"><div class="filtros">';
  for(const f of ["Todos","Service","Reparación","Repuestos","Otro"]){
    h += '<button class="filtro'+(filtroTipo===f?" active":"")+'" onclick="setFiltro(\''+f+'\')">'+f+'</button>';
  }
  h += '</div><button class="btn btn-grad" onclick="abrirModal(\'rodados\',null,\''+id+'\')">+ Nuevo registro</button></div>';

  let regs = regsDe(id);
  if(filtroTipo!=="Todos") regs = regs.filter(r=>r.tipo===filtroTipo);
  regs.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));

  h += '<div class="glass tbl-card"><div class="tbl-scroll"><table><thead><tr>'
    + '<th>Fecha</th><th>Tipo</th><th>N° Serv.</th><th>KM</th><th>Descripción</th><th>Taller / Proveedor</th><th>Factura</th><th>Archivo</th><th class="right">Costo</th><th></th>'
    + '</tr></thead><tbody>';

  if(regs.length===0){
    h += '<tr><td colspan="10"><div class="empty">No hay registros'+(filtroTipo!=="Todos"?' de tipo "'+esc(filtroTipo)+'"':'')+'. Usá <b>+ Nuevo registro</b> para cargar el primero.</div></td></tr>';
  }else{
    for(const r of regs){
      h += '<tr>'
        + '<td class="nowrap">'+fmtFecha(r.fecha)+'</td>'
        + '<td>'+chipTipo(r.tipo)+'</td>'
        + '<td>'+(r.tipo==="Service" ? esc(r.nroService||"—") : '<span class="muted">·</span>')+'</td>'
        + '<td class="nowrap">'+fmtKm(parseFloat(r.km))+'</td>'
        + '<td style="min-width:190px">'+(esc(r.descripcion)||"—")+'</td>'
        + '<td>'+esc(r.taller||"—")+'</td>'
        + '<td class="nowrap">'+esc(r.factura||"—")+'</td>'
        + '<td style="max-width:180px;word-break:break-all;font-size:.78rem" class="muted">'+esc(r.archivo||"—")+'</td>'
        + '<td class="right money">'+fmtMoney(parseFloat(r.costo))+'</td>'
        + accionesFila("rodados", r.id)
        + '</tr>';
    }
  }
  h += '</tbody></table></div></div>';
  return h;
}

const SHEET_ID = "1aC8BYwxPdaOUY7xhc711M6nqdYLpJyb5u3kspgGNsSY";
const SHEET_GID = "1846187867";
const SHEET_LINK = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit#gid="+SHEET_GID;
let solData = null, solCargando = false, solError = null, solFiltro = "Abiertas";
let solDetalles = {}, solExpandidas = {};

function gvizUrl(opts){
  let u = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&headers=0";
  if(opts.gid) u += "&gid="+encodeURIComponent(opts.gid);
  if(opts.sheet) u += "&sheet="+encodeURIComponent(opts.sheet);
  return u;
}
async function gvizFetch(opts){
  const res = await fetch(gvizUrl(opts));
  if(!res.ok) throw new Error("HTTP "+res.status);
  const txt = await res.text();
  const a = txt.indexOf("("), b = txt.lastIndexOf(")");
  if(a<0 || b<0 || b<=a) throw new Error("Respuesta inesperada de Google (¿la hoja está compartida por enlace?)");
  const data = JSON.parse(txt.slice(a+1,b));
  if(data.status==="error") throw new Error((data.errors && data.errors[0] && data.errors[0].detailed_message) || "Error de Google Sheets");
  return (data.table.rows||[]).map(r => (r.c||[]).map(c => c ? {v:c.v, f:(c.f!=null ? String(c.f) : (c.v!=null ? String(c.v) : ""))} : {v:null, f:""}));
}
const celdaS = (fila,i) => (i>=0 && fila && fila[i]) ? fila[i].f.trim() : "";
function numeroS(x){
  if(x==null || x==="") return 0;
  if(typeof x === "number") return x;
  const n = parseFloat(String(x).replace(/[^0-9.,-]/g,"").replace(/\./g,"").replace(",","."));
  return isNaN(n) ? 0 : n;
}
const numCelda = (fila,i) => (i>=0 && fila && fila[i] && typeof fila[i].v==="number") ? fila[i].v : numeroS(celdaS(fila,i));

function parsearPrincipal(filas){
  let hi=-1; const cols={};
  for(let i=0;i<filas.length;i++){
    const up = filas[i].map(c=>c.f.trim().toUpperCase());
    if(up.includes("ESTADO") && up.includes("DESCRIPCIÓN")){
      hi=i; up.forEach((t,j)=>{ if(t && cols[t]==null) cols[t]=j; });
      break;
    }
  }
  if(hi<0) throw new Error("No encontré los encabezados (N° de cotización / Estado / Descripción) en la pestaña vinculada del sheet");
  const ix = n => (cols[n]!=null ? cols[n] : -1);
  const out=[];
  for(let i=hi+1;i<filas.length;i++){
    const f=filas[i];
    const nroTxt = celdaS(f, ix("N° DE COTIZACIÓN"));
    if(!nroTxt || isNaN(parseInt(nroTxt))) continue;
    out.push({
      nro: parseInt(nroTxt),
      fecha: celdaS(f, ix("FECHA RECEPCIÓN DE SC")),
      area: celdaS(f, ix("ÁREA QUE SOLICITA")),
      desc: celdaS(f, ix("DESCRIPCIÓN")),
      estado: celdaS(f, ix("ESTADO")).toUpperCase(),
      tango: celdaS(f, ix("N° SOLICITUD DE COMPRA - TANGO")),
      pendiente: numCelda(f, ix("MONTO PENDIENTE DE COMPRA")),
      comprado: numCelda(f, ix("MONTO COMPRADO")),
      obs: celdaS(f, ix("OBSERVACIONES")),
      dias: celdaS(f, ix("DIAS TRANSCURRIDOS SC"))
    });
  }
  return out;
}

function parsearDetalle(filas){
  const det = {items:[], motivo:"", estado:""};
  let hi=-1, iProd=-1, iSol=-1, iPend=-1, iComp=-1;
  for(let i=0;i<filas.length;i++){
    const f=filas[i];
    for(let j=0;j<f.length;j++){
      const t=f[j].f.trim();
      if(t==="Motivo del pedido:" && !det.motivo) det.motivo = celdaS(f,j+1) || celdaS(f,j+2);
      if(t==="Estado:" && !det.estado) det.estado = (celdaS(f,j+1) || celdaS(f,j+2)).toUpperCase();
    }
    const up = f.map(c=>c.f.trim().toUpperCase());
    if(up.includes("PRODUCTO") && up.includes("CANTIDAD SOLICITADA")){
      hi=i;
      iProd = up.indexOf("PRODUCTO");
      iSol  = up.indexOf("CANTIDAD SOLICITADA");
      iComp = up.indexOf("CANTIDAD COMPRADA");
      iPend = up.indexOf("CANTIDAD PENDIENTE");
      break;
    }
  }
  if(hi<0) return det;
  let vacias = 0;
  for(let i=hi+1;i<filas.length && i<hi+300;i++){
    const f=filas[i];
    const prod = celdaS(f,iProd);
    if(!prod){ vacias++; if(vacias>3) break; continue; }
    vacias = 0;
    const pu = prod.toUpperCase();
    if(pu==="TOTAL" || pu==="RENGLÓN" || pu==="RENGLON") break;
    const sol  = numCelda(f,iSol);
    const comp = numCelda(f,iComp);
    let pend;
    const pv = (iPend>=0 && f[iPend]) ? f[iPend].v : null;
    if(typeof pv === "number") pend = pv;
    else{
      const pt = celdaS(f,iPend);
      pend = /\d/.test(pt) ? numeroS(pt) : (sol - comp);
    }
    if(pend < 0) pend = 0;
    det.items.push({prod, sol, comp, pend});
  }
  return det;
}

async function cargarSolicitudes(){
  solCargando = true; solError = null; render();
  try{
    const filas = await gvizFetch({gid: SHEET_GID});
    solData = parsearPrincipal(filas);
  }catch(e){ solError = (e && e.message) ? e.message : String(e); solData = null; }
  solCargando = false; render();
}

async function toggleDetalleSol(nro){
  if(solExpandidas[nro]){ delete solExpandidas[nro]; render(); return; }
  solExpandidas[nro] = true;
  if(!solDetalles[nro]){
    solDetalles[nro] = {cargando:true};
    render();
    try{
      const filas = await gvizFetch({sheet: String(nro)});
      solDetalles[nro] = parsearDetalle(filas);
    }catch(e){ solDetalles[nro] = {error: (e && e.message) ? e.message : String(e)}; }
  }
  render();
}

  renderTabs();
  let h = "";
  if(modulo==="rodados") h = (vistaActual==="resumen") ? renderResumen() : renderVehiculo(vistaActual);
  else if(modulo==="remises") h = renderRemises();
  else if(modulo==="refrigerios") h = renderRefrigerios();
  else if(modulo==="alojamiento") h = renderAlojamiento();
  else if(modulo==="solicitudes") h = renderSolicitudes();
  else if(modulo==="seguimientos") h = renderSeguimientos();
  else h = renderTareas();
  document.getElementById("main").innerHTML = h;
}

/* ============ Exportar / Importar ============ */
function descargar(nombre, contenido, mime){
  const blob = new Blob([contenido], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}
function exportarJSON(){
  const f = hoyISO();
  descargar("Respaldo Gestion "+f+".json", JSON.stringify(db,null,2), "application/json");
  toast("✓ Respaldo descargado — guardalo en la carpeta Rodados");
}
function importarJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.vehiculos)) throw new Error("formato");
      const COLS = ["registros","remises","refrigerios","alojamientos","tareas","seguimientos"];
      for(const k of COLS) if(!Array.isArray(d[k])) d[k] = [];
      const combinar = confirm("¿COMBINAR el respaldo con los datos actuales?\n\nAceptar = combinar (agrega lo nuevo, NO borra nada de lo que ya tenés)\nCancelar = reemplazo total");
      if(combinar){
        let agregados = 0;
        for(const v of d.vehiculos){
          const cur = db.vehiculos.find(x=>x.id===v.id);
          if(!cur){ db.vehiculos.push(v); }
          else{
            if(!cur.kmActual && v.kmActual) cur.kmActual = v.kmActual;
            if(!cur.proxServiceKm && v.proxServiceKm) cur.proxServiceKm = v.proxServiceKm;
          }
        }
        for(const k of COLS){
          for(const r of d[k]){
            if(r && r.id && !db[k].find(x=>x.id===r.id)){ db[k].push(r); agregados++; }
          }
        }
        persistir(); modulo = "rodados"; vistaActual = "resumen"; render();
        toast("✓ Respaldo combinado: "+agregados+" registros agregados, nada se borró");
      }else{
        if(!confirm("⚠ ATENCIÓN: esto REEMPLAZA todos los datos actuales por los del respaldo.\n¿Seguro que querés continuar?")) return;
        db = d; persistir(); modulo = "rodados"; vistaActual = "resumen"; render();
        toast("✓ Respaldo restaurado (reemplazo total)");
      }
    }catch(e){ toast("⚠ El archivo no es un respaldo válido"); }
  };
  rd.readAsText(file);
  ev.target.value = "";
}
function exportarCSV(){
  const sep = ";";
  let filas, nombre;
  const f = hoyISO();
  if(modulo==="rodados"){
    filas = [["Patente","Modelo","Fecha","Tipo","N° Service","KM","Descripción","Taller/Proveedor","N° Factura","Archivo factura","Costo ARS"]];
    const regs = [...db.registros].sort((a,b)=>
      a.vehiculoId===b.vehiculoId ? (a.fecha||"").localeCompare(b.fecha||"") : String(a.vehiculoId).localeCompare(String(b.vehiculoId)));
    for(const r of regs){
      const v = vehiculo(r.vehiculoId) || {patente:r.vehiculoId, modelo:""};
      filas.push([v.patente, v.modelo, fmtFecha(r.fecha), r.tipo, r.nroService, r.km, r.descripcion, r.taller, r.factura, r.archivo, r.costo]);
    }
    nombre = "Rodados "+f+".csv";
  }else if(modulo==="remises"){
    filas = [["Fecha","Remisería/Chofer","Trayecto","Solicitante","Motivo","N° Factura","Archivo factura","Costo ARS"]];
    for(const r of [...db.remises].sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""))){
      filas.push([fmtFecha(r.fecha), r.proveedor, r.trayecto, r.solicitante, r.motivo, r.factura, r.archivo, r.costo]);
    }
    nombre = "Remises "+f+".csv";
  }else if(modulo==="refrigerios"){
    filas = [["Fecha","Tipo","Proveedor","Detalle","N° Factura","Archivo factura","Costo ARS"]];
    for(const r of [...db.refrigerios].sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""))){
      filas.push([fmtFecha(r.fecha), r.tipo, r.proveedor, r.detalle, r.factura, r.archivo, r.costo]);
    }
    nombre = "Refrigerios "+f+".csv";
  }else if(modulo==="alojamiento"){
    filas = [["Fecha desde","Fecha hasta","Personas","Sector","Destino/Alojamiento","Motivo","N° Factura","Archivo factura","Costo ARS"]];
    for(const r of [...db.alojamientos].sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""))){
      filas.push([fmtFecha(r.fecha), fmtFecha(r.fechaHasta), r.personas, r.sector, r.destino, r.motivo, r.factura, r.archivo, r.costo]);
    }
    nombre = "Alojamiento "+f+".csv";
  }else if(modulo==="solicitudes"){
    if(!solData){ toast("⚠ Primero cargá las solicitudes"); return; }
    filas = [["N°","Fecha SC","Área","Descripción","Estado","Tango","Monto pendiente","Monto comprado","Observaciones"]];
    for(const s of [...solData].sort((a,b)=>a.nro-b.nro)){
      filas.push([s.nro, s.fecha, s.area, s.desc, s.estado, s.tango, s.pendiente, s.comprado, s.obs]);
    }
    nombre = "Solicitudes "+f+".csv";
  }else if(modulo==="seguimientos"){
    filas = [["Producto","Cantidad","Ubicación","Estado","Encargado","Detalle"]];
    const segs = [...db.seguimientos].sort((a,b)=>String(a.producto||"").localeCompare(String(b.producto||"")));
    for(const s of segs){
      filas.push([s.producto, s.cantidad, s.ubicacion, s.estado, s.encargado, s.detalle]);
    }
    nombre = "Seguimientos "+f+".csv";
  }else{
    filas = [["Estado","Tarea","Detalle","Responsable","Prioridad","Fecha límite","Creada"]];
    for(const t of db.tareas){
      filas.push([t.estado, t.titulo, t.detalle, t.responsable, t.prioridad, fmtFecha(t.fechaLimite), fmtFecha(t.creada)]);
    }
    nombre = "Tareas "+f+".csv";
  }
  const csv = "﻿" + filas.map(fl => fl.map(c => '"'+String(c??"").replace(/"/g,'""')+'"').join(sep)).join("\r\n");
  descargar(nombre, csv, "text/csv;charset=utf-8");
  toast("✓ CSV exportado (se abre con Excel)");
}
